services:
  cacheflow:

    # build the image from the Dockerfile in this folder
    build: .

    # host:container, same as -p
    ports:
      - "3000:8080"

    # volume-name:path-in-container, same as -v
    volumes:
      - cacheflow-data:/app/data

    # settings for the proxy ; the Dockerfile's ENTRYPOINT turns these into --origin, --ttl, --max-entries
    # values are quoted so YAML keeps them as strings, which is what env vars must be
    environment:
      ORIGIN: https://dummyjson.com
      TTL: "15"
      MAX_ENTRIES: "100"
      PORT : "8080"

# declares the named volume used above
volumes:
  cacheflow-data: